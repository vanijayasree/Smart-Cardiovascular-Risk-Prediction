{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm p-4">
  <h3>Manage Users</h3>
  <table class="table table-striped mt-3">
    <thead><tr><th>ID</th><th>Username</th><th>Status</th><th>Action</th></tr></thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{% if u.is_active %}Active{% else %}Disabled{% endif %}</td>
        <td>
          {% if u.is_active %}
            <button class="btn btn-sm btn-danger" onclick="toggleUser({{u.id}},0)">Disable</button>
          {% else %}
            <button class="btn btn-sm btn-success" onclick="toggleUser({{u.id}},1)">Enable</button>
          {% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
async function toggleUser(id,status){
  const res=await fetch(`/admin/toggle_user/${id}/${status}`,{method:"POST"});
  location.reload();
}
</script>
{% endblock %}
