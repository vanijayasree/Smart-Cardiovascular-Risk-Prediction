{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
  <div class="card shadow-lg border-success">
    <div class="card-header bg-success text-white fw-bold">
      🥗 Diet Plan - {{ prediction }}
    </div>
    <div class="card-body">
      <p><b>Recommended Plan:</b> {{ diet }}</p>
      <h5 class="mt-3">🍎 Example Foods</h5>
      <ul>
        {% for item in diet_details %}
          <li>{{ item }}</li>
        {% endfor %}
      </ul>
    </div>
    <div class="card-footer text-end">
      <a href="{{ url_for('show_recommendations', report_id=report_id) }}" class="btn btn-secondary">
        ⬅ Back to Recommendations
      </a>
    </div>
  </div>
</div>
{% endblock %}
