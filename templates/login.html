{% extends 'base.html' %}
{% block content %}
<div class="row vh-100">
  <!-- Left side image -->
  <div class="col-md-6 d-none d-md-block p-0">
    <img src="{{ url_for('static', filename='images/heartimagen.jpg') }}"
         alt="Heart" class="w-100 h-100" style="object-fit:cover;">
  </div>

  <!-- Right side login form -->
  <div class="col-md-6 d-flex align-items-center bg-light">
    <div class="card shadow-sm p-4 w-75 mx-auto">
      <h3 class="mb-3 text-center text-primary">
        <i class="bi bi-heart-pulse-fill text-danger"></i> Heart Risk Prediction Login
      </h3>

      <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="username" class="form-label">👤 Username</label>
          <input class="form-control" id="username" name="username" required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">🔒 Password</label>
          <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <hr>
      <p class="mt-3 text-center">
        🆕 New user? <a href="{{ url_for('register') }}" class="text-decoration-none">Register here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
