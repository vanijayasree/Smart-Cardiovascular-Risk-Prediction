{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="mb-4 text-center text-primary">
            <i class="bi bi-person-plus"></i> Create Account
          </h3>
          
          <form method="POST" action="{{ url_for('register') }}">
            
            <div class="mb-3">
              <label for="username" class="form-label">
                <i class="bi bi-person-circle"></i> Username
              </label>
              <input 
                id="username" 
                class="form-control" 
                type="text" 
                name="username" 
                placeholder="Choose a username" 
                minlength="3"
                maxlength="50"
                required
                autofocus>
              <small class="text-muted">Minimum 3 characters</small>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">
                <i class="bi bi-lock-fill"></i> Password
              </label>
              <input 
                id="password" 
                class="form-control" 
                type="password" 
                name="password" 
                placeholder="Choose a strong password" 
                minlength="6"
                maxlength="100"
                required>
              <small class="text-muted">Minimum 6 characters</small>
            </div>

            <!-- SECURITY FIX: Role selection REMOVED -->
            <!-- All new users are automatically assigned 'User' role -->
            <!-- Only admin accounts can be created via setupp.py -->

            <button type="submit" class="btn btn-primary w-100 mb-2">
              <i class="bi bi-check-circle"></i> Register
            </button>
          </form>

          <hr>
          
          <p class="text-center text-muted">
            Already have an account? 
            <a href="{{ url_for('login') }}" class="text-primary fw-bold">Login here</a>
          </p>
          
          <p class="text-center text-muted small">
            <a href="{{ url_for('about') }}">About this project</a>
          </p>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
